<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Cliente</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 60px auto; padding: 0 20px; }
        label { display: block; margin-top: 15px; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="email"] { width: 100%; padding: 8px; box-sizing: border-box; }
        button { margin-top: 20px; padding: 10px 20px; cursor: pointer; }
        .flash { background: #fdecea; color: #611a15; padding: 10px; border-radius: 4px; margin-top: 15px; }
        .voltar { display: inline-block; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Editar Cliente</h1>


    <p>Logado como {{ session['cliente_nome'] }} · <a href="{{ url_for('logout') }}">Sair</a></p>
    {% with mensagens = get_flashed_messages() %}
        {% if mensagens %}
            {% for mensagem in mensagens %}
                <div class="flash">{{ mensagem }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" value="{{ cliente['nome'] }}">

        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ cliente['email'] }}">

        <button type="submit">Salvar alterações</button>
    </form>

    <a class="voltar" href="{{ url_for('listar_clientes') }}">Cancelar</a>
</body>
</html>
