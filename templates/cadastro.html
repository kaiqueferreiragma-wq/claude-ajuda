<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Cliente</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 60px auto;
            padding: 0 20px;
        }
        h1 {
            font-size: 22px;
        }
        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"],
        input[type="email"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            cursor: pointer;
        }
        .flash {
            background: #fdecea;
            color: #611a15;
            padding: 10px;
            border-radius: 4px;
            margin-top: 15px;
        }
        .voltar {
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Cadastro de Cliente</h1>

    {% with mensagens = get_flashed_messages() %}
        {% if mensagens %}
            {% for mensagem in mensagens %}
                <div class="flash">{{ mensagem }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">
        <label for="nome">Nome Completo</label>
        <input type="text" id="nome" name="nome">

        <label for="email">Email de Login</label>
        <input type="email" id="email" name="email">

        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha">
        <button type="submit">Cadastrar</button>

    </form>

    <a class="voltar" href="{{ url_for('listar_clientes') }}">Ver clientes cadastrados</a>
</body>
</html>
